<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Digital — Sistem Aman</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:linear-gradient(135deg,#1e40af,#1e3a8a);min-height:100vh;padding:20px}
        .container{max-width:460px;margin:0 auto;background:#fff;border-radius:16px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
        h1{text-align:center;color:#1e40af;margin-bottom:10px;font-size:20px}
        .user-info{background:#eff6ff;border-left:4px solid #3b82f6;padding:12px;border-radius:8px;margin-bottom:20px;font-size:14px}
        .check{padding:14px;border-radius:10px;margin-bottom:12px;font-size:14px;border-left:4px solid #ccc}
        .check.wait{background:#fef3c7;color:#92400e;border-color:#f59e0b}
        .check.ok{background:#d1fae5;color:#065f46;border-color:#10b981}
        .check.fail{background:#fee2e2;color:#991b1b;border-color:#ef4444}
        .status{text-align:center;padding:18px;border-radius:12px;margin:18px 0;font-weight:600;font-size:16px}
        .status.ok{background:#d1fae5;color:#065f46;border:2px solid #10b981}
        .status.no{background:#fee2e2;color:#991b1b;border:2px solid #ef4444}
        .status.pending{background:#eff6ff;color:#1e40af;border:2px solid #3b82f6}
        .cam{background:#f3f4f6;border-radius:12px;padding:18px;margin:20px 0;text-align:center}
        video,img{width:100%;border-radius:10px;margin-bottom:12px;background:#000;min-height:240px;object-fit:cover}
        button{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s;margin-bottom:8px}
        .btn-blue{background:#2563eb;color:#fff}
        .btn-green{background:#10b981;color:#fff}
        .btn-red{background:#ef4444;color:#fff}
        .btn:disabled{background:#9ca3af;cursor:not-allowed;opacity:.7}
        .hidden{display:none!important}
        .log{margin-top:15px;font-size:12px;color:#6b7280;line-height:1.8;background:#f9fafb;padding:12px;border-radius:8px}
        .input-group{margin-bottom:12px}
        input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:8px}
    </style>
</head>
<body>
<div class="container">
    <h1>📋 Absen Digital Kantor</h1>

    <!-- Login Area -->
    <div id="loginArea">
        <div class="input-group">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Kata Sandi">
        </div>
        <button id="btnLogin" class="btn-blue">🔐 Masuk</button>
    </div>

    <!-- Setelah Login -->
    <div id="mainArea" class="hidden">
        <div class="user-info">
            <strong>👤 <span id="namaUser"></span></strong><br>
            <small id="emailUser"></small>
        </div>

        <div id="cGps" class="check wait">
            <div style="font-weight:600;margin-bottom:4px">📍 Lokasi GPS</div>
            <span id="tGps">Memeriksa...</span>
        </div>

        <div id="status" class="status pending">⏳ Menyiapkan...</div>

        <div class="cam">
            <video id="video" autoplay playsinline class="hidden"></video>
            <img id="fotoView" class="hidden" alt="Bukti Foto">
            <button id="bukaKamera" class="btn-blue hidden">📷 Buka Kamera</button>
            <button id="ambilFoto" class="btn-blue hidden">Ambil Foto</button>
            <button id="kirim" class="btn-green hidden">✅ Kirim Absen</button>
        </div>

        <div id="log" class="log"><strong>Status Sistem:</strong><br></div>
        <button id="btnLogout" class="btn-red" style="margin-top:15px">Keluar</button>
    </div>
</div>

<script>
// ================= KONFIGURASI FIREBASE =================
const FIREBASE_CONFIG = {
    apiKey: "ISI_API_KEY_ANDA",
    authDomain: "proyek-anda.firebaseapp.com",
    projectId: "proyek-anda",
    storageBucket: "proyek-anda.appspot.com",
    messagingSenderId: "XXX",
    appId: "XXX"
};
// =========================================================

// Inisialisasi Firebase
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const el = {
    loginArea: document.getElementById('loginArea'),
    mainArea: document.getElementById('mainArea'),
    email: document.getElementById('email'),
    password: document.getElementById('password'),
    btnLogin: document.getElementById('btnLogin'),
    namaUser: document.getElementById('namaUser'),
    emailUser: document.getElementById('emailUser'),
    cGps: document.getElementById('cGps'),
    tGps: document.getElementById('tGps'),
    status: document.getElementById('status'),
    video: document.getElementById('video'),
    fotoView: document.getElementById('fotoView'),
    bukaKamera: document.getElementById('bukaKamera'),
    ambilFoto: document.getElementById('ambilFoto'),
    kirim: document.getElementById('kirim'),
    log: document.getElementById('log'),
    btnLogout: document.getElementById('btnLogout')
};

let userLogin = null;
let dataGps = null;
let blobFoto = null;
let streamKamera = null;
let sedangKirim = false;

function log(pesan) {
    el.log.innerHTML += `[${new Date().toLocaleTimeString('id-ID')}] ${pesan}<br>`;
}

// === LOGIN ===
el.btnLogin.addEventListener('click', async () => {
    el.btnLogin.disabled = true;
    try {
        const kredensial = await auth.signInWithEmailAndPassword(el.email.value, el.password.value);
        userLogin = kredensial.user;
        log('✅ Login berhasil');
    } catch (err) {
        alert(`Gagal masuk: ${err.message}`);
        log(`❌ Login gagal: ${err.message}`);
    }
    el.btnLogin.disabled = false;
});

// === DETEKSI STATUS LOGIN ===
auth.onAuthStateChanged((user) => {
    if (user) {
        userLogin = user;
        el.loginArea.classList.add('hidden');
        el.mainArea.classList.remove('hidden');
        el.namaUser.textContent = user.displayName || user.email;
        el.emailUser.textContent = user.email;
        log('✅ Pengguna teridentifikasi');
        mulaiCekLokasi();
    } else {
        userLogin = null;
        el.loginArea.classList.remove('hidden');
        el.mainArea.classList.add('hidden');
    }
});

// === CEK LOKASI — KIRIM DATA MENTAH SAJA ===
function mulaiCekLokasi() {
    el.cGps.className = 'check wait';
    el.tGps.textContent = 'Meminta izin lokasi...';

    if (!navigator.geolocation) {
        el.cGps.className = 'check fail';
        el.tGps.textContent = 'Perangkat tidak mendukung GPS';
        el.status.className = 'status no';
        el.status.textContent = '❌ GPS wajib untuk absen';
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            dataGps = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                akurasi: pos.coords.accuracy
            };
            el.cGps.className = 'check ok';
            el.tGps.textContent = `✅ Terbaca — Akurasi: ${Math.round(pos.coords.akurasi)} m`;
            log(`📍 Lokasi: ${dataGps.lat.toFixed(6)}, ${dataGps.lng.toFixed(6)} (Akurasi: ${Math.round(dataGps.akurasi)} m)`);
            el.bukaKamera.classList.remove('hidden');
            el.status.className = 'status pending';
            el.status.textContent = 'Siap ambil foto';
        },
        (err) => {
            el.cGps.className = 'check fail';
            el.tGps.textContent = `Gagal: ${err.message}`;
            el.status.className = 'status no';
            el.status.textContent = '❌ Lokasi wajib diaktifkan';
            log(`❌ GPS ditolak/gagal: ${err.message}`);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
}

// === KAMERA ===
el.bukaKamera.addEventListener('click', async () => {
    try {
        streamKamera = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: 1280, height: 720 }
        });
        el.video.srcObject = streamKamera;
        el.video.classList.remove('hidden');
        el.bukaKamera.classList.add('hidden');
        el.ambilFoto.classList.remove('hidden');
        log('📷 Kamera aktif');
    } catch {
        alert('Izin kamera wajib diberikan!');
    }
});

el.ambilFoto.addEventListener('click', () => {
    const kanvas = document.createElement('canvas');
    kanvas.width = el.video.videoWidth;
    kanvas.height = el.video.videoHeight;
    const ctx = kanvas.getContext('2d');
    ctx.drawImage(el.video, 0, 0);
    
    // Kompres foto sebelum dikirim
    kanvas.toBlob(
        (blob) => {
            blobFoto = blob;
            el.video.classList.add('hidden');
            el.fotoView.src = URL.createObjectURL(blob);
            el.fotoView.classList.remove('hidden');
            el.ambilFoto.classList.add('hidden');
            el.kirim.classList.remove('hidden');
            streamKamera?.getTracks().forEach(t => t.stop());
            log('📸 Foto diambil, siap dikirim');
        },
        'image/jpeg',
        0.8
    );
});

// === KIRIM ABSEN — KE SERVER/CLOUD FUNCTION ===
el.kirim.addEventListener('click', async () => {
    if (sedangKirim || !dataGps || !blobFoto || !userLogin) return;
    sedangKirim = true;
    el.kirim.disabled = true;
    el.kirim.textContent = 'Mengirim...';
    el.status.className = 'status pending';
    el.status.textContent = '⏳ Memproses di server...';

    try {
        // 1. Upload foto ke Storage
        const uid = userLogin.uid;
        const tanggal = new Date().toISOString().slice(0, 10);
        const namaFile = `absen/${uid}/${tanggal}_${Date.now()}.jpg`;
        const refFoto = storage.ref(namaFile);
        await refFoto.put(blobFoto);
        const urlFoto = await refFoto.getDownloadURL();
        log('📤 Foto terunggah');

        // 2. Panggil Cloud Function untuk validasi & simpan
        const kirim = await fetch(
            'https://asia-southeast1-proyek-anda.cloudfunctions.net/validasiAbsen',
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: uid,
                    email: userLogin.email,
                    nama: userLogin.displayName || userLogin.email,
                    lat: dataGps.lat,
                    lng: dataGps.lng,
                    akurasi: dataGps.akurasi,
                    urlFoto: urlFoto
                })
            }
        );

        const hasil = await kirim.json();

        if (hasil.diterima) {
            el.status.className = 'status ok';
            el.status.innerHTML = `✅ ABSEN BERHASIL<br><small>${hasil.pesan}</small>`;
            log(`✅ DITERIMA: ${hasil.pesan}`);
            el.kirim.textContent = '✅ Sudah Absen';
        } else {
            el.status.className = 'status no';
            el.status.innerHTML = `❌ ${hasil.pesan}<br><small>${hasil.alasan || ''}</small>`;
            log(`❌ DITOLAK: ${hasil.pesan}`);
            el.kirim.disabled = false;
            el.kirim.textContent = 'Coba Lagi';
        }
    } catch (err) {
        el.status.className = 'status no';
        el.status.textContent = `❌ Gagal terhubung: ${err.message}`;
        log(`❌ Error: ${err.message}`);
        el.kirim.disabled = false;
        el.kirim.textContent = 'Coba Lagi';
    }
    
    sedangKirim = false;
});

// === KELUAR ===
el.btnLogout.addEventListener('click', () => {
    auth.signOut();
    el.email.value = '';
    el.password.value = '';
    el.video.classList.add('hidden');
    el.fotoView.classList.add('hidden');
    el.bukaKamera.classList.add('hidden');
    el.ambilFoto.classList.add('hidden');
    el.kirim.classList.add('hidden');
    el.log.innerHTML = '<strong>Status Sistem:</strong><br>';
    dataGps = null;
    blobFoto = null;
});
</script>
</body>
</html>
